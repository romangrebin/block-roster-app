name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # app/ uses Next's generated route helper types (LayoutProps, PageProps, …), which live in
      # .next/types/ — a fresh checkout doesn't have them, so tsc must run after typegen.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The app reads these at request time, not build time (every page is dynamic), but
          # the Supabase client constructors still want a syntactically valid URL if reached.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_CARTO_API_KEY: placeholder-carto-key
